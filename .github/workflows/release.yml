name: Release

# Produces signed (where certs exist) installer bundles for Windows, macOS, and Linux,
# plus the standalone `shalgalt-server` binary, and publishes the Tauri updater manifest
# (latest.json) to gh-pages. Triggered by pushing a `v*` tag.
#
# The GitHub Release is created as a DRAFT (releaseDraft: true) so a human reviews and
# publishes it manually — nothing ships to users automatically.
#
# Signing posture for v0 (no certs available — master plan §6.8/§6.9):
#   - Updater signing (TAURI_SIGNING_PRIVATE_KEY + _PASSWORD) is REQUIRED. Without it the
#     produced bundles cannot be verified by tauri-plugin-updater.
#   - Windows Authenticode (WINDOWS_CERTIFICATE) is OPTIONAL — absent ⇒ unsigned build,
#     logged as a warning, never a failure.
#   - macOS notarization (APPLE_* group) is OPTIONAL and all-or-nothing — any member
#     absent ⇒ skip signing/notarization and ship an unsigned .dmg.

on:
  push:
    tags:
      - "v*"
  # Allow re-running a release build manually against the current ref.
  workflow_dispatch:

# Tauri-action needs to create the draft release and upload assets to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned for reproducible Windows builds. Keep in lockstep with ci.yml and the
  # fetch-binaries scripts' OpenCvVersion default. See docs/adr/0001.
  OPENCV_VERSION: "4.10.0"

jobs:
  release:
    name: Bundle (${{ matrix.platform.name }})
    timeout-minutes: 90
    strategy:
      # Never let one OS failure abort the other bundles — a partial draft is still useful.
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            # ubuntu-latest pins OpenCV to apt 4.6 — matching rust-check and the local
            # binding the legacy ArUco path is written against. ubuntu-22.04 would lower
            # the AppImage's glibc floor for older machines, but ships OpenCV 4.5.4 whose
            # legacy `aruco::detect_markers` has a different arity than 4.6, which the
            # build does not yet handle. FOLLOW-UP: lower the glibc floor once OpenCV is
            # pinned uniformly across CI and the release (PPA or static build).
            runner: ubuntu-latest
            # Native host target — leave tauri-action's `args` target unset.
            rust_target: ""
            tauri_target_arg: ""
            server_bin: shalgalt-server
            server_asset: shalgalt-server-linux-x86_64
          - name: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_target_arg: "--target aarch64-apple-darwin"
            server_bin: shalgalt-server
            server_asset: shalgalt-server-macos-arm64
          - name: windows-x86_64
            runner: windows-latest
            rust_target: ""
            tauri_target_arg: ""
            server_bin: shalgalt-server.exe
            server_asset: shalgalt-server-windows-x86_64.exe
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # On macOS the arm64 target is the host on macos-latest, but request it
          # explicitly so `--target` always resolves.
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.name }}-release

      # --- Per-OS system dependencies (ported verbatim from ci.yml) --------------

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libopencv-dev \
            clang \
            libclang-dev

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install opencv pkg-config

      - name: Cache OpenCV (Windows)
        if: runner.os == 'Windows'
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: C:\tools\opencv
          key: opencv-windows-${{ env.OPENCV_VERSION }}

      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows' && steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/${{ env.OPENCV_VERSION }}/opencv-${{ env.OPENCV_VERSION }}-windows.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile opencv.exe
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          # The opencv-X.Y.Z-windows.exe is a 7-Zip self-extractor. The `-o` flag
          # is the destination root; it creates `C:\tools\opencv\` underneath.
          Start-Process -FilePath .\opencv.exe -ArgumentList '-o"C:\tools" -y' -Wait -NoNewWindow
          Remove-Item opencv.exe

      - name: Configure OpenCV env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # opencv-rust auto-discovers via these env vars when pkg-config fails (Windows).
          # opencv_world<MAJOR><MINOR><PATCH> with dots stripped — 4.10.0 ⇒ opencv_world4100.
          $libCode = "${{ env.OPENCV_VERSION }}" -replace '\.', ''
          "OPENCV_LINK_LIBS=opencv_world$libCode" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENCV_LINK_PATHS=C:\tools\opencv\build\x64\vc16\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENCV_INCLUDE_PATHS=C:\tools\opencv\build\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          # libclang for opencv-rust bindgen — windows-latest preinstalls LLVM here.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The DLL must be on PATH so the produced .exe can resolve it at runtime.
          "C:\tools\opencv\build\x64\vc16\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # --- Native runtime libraries → apps/desktop/resources/ --------------------
      # The Track-Scripts fetch-binaries scripts populate the resources/ dir that
      # tauri.conf.json bundles via `resources/*`. On Windows the .ps1 also handles
      # OpenCV (the self-extractor is reused from the C:\tools\opencv cache above).

      - name: Fetch bundled native libraries (unix)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-binaries.sh

      - name: Fetch bundled native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/fetch-binaries.ps1 -OpenCvVersion "${{ env.OPENCV_VERSION }}"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # --- Standalone server binary ----------------------------------------------
      # Built before the Tauri bundle so a compile break here fails fast. Attached
      # to the draft release as a per-OS asset in a later step.

      - name: Build standalone server
        run: cargo build --release -p shalgalt-server --bin shalgalt-server ${{ matrix.platform.tauri_target_arg }}

      # --- Decide whether macOS signing/notarization is possible ------------------
      # All-or-nothing: every APPLE_* secret must be present or we ship unsigned.
      - name: Resolve macOS signing availability
        if: runner.os == 'macOS'
        id: macos_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing + notarization: ENABLED (all APPLE_* secrets present)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing skipped — one or more APPLE_* secrets missing. Shipping unsigned .dmg."
          fi

      - name: Warn on missing Windows certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # `secrets.*` is not allowed in step `if:` expressions, so the presence
          # check happens here against an env-mapped value instead.
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "::warning::WINDOWS_CERTIFICATE not set — producing an UNSIGNED Windows build (self-signed v0)."
          fi

      # --- AppImage bundling knobs (Linux) ---------------------------------------
      # Tauri's AppImage step runs linuxdeploy, which follows the binary's NEEDED
      # entries and bundles the whole OpenCV .so chain (core/imgproc/imgcodecs/
      # objdetect/calib3d/features2d/flann + transitive jpeg/png/tiff/tbb) into the
      # AppDir with an $ORIGIN rpath — so OpenCV ships self-contained. These knobs make
      # that reliable in CI: extract-and-run avoids FUSE (unavailable on GH runners),
      # and NO_STRIP stops stripping that can break the bundled OpenCV libraries.
      - name: Configure AppImage bundling env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=true" >> "$GITHUB_ENV"

      # --- Tauri build + draft release upload ------------------------------------
      # tauri-action runs the config's beforeBuildCommand (pnpm build) itself, then
      # `tauri build`, then uploads the bundles to the draft release. projectPath is
      # apps/desktop because `pnpm tauri` does `cd apps/desktop && tauri` (the Tauri
      # crate root that owns tauri.conf.json).
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing — REQUIRED. Without these the updater cannot verify bundles.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code-signing certificates are intentionally NOT passed in v0. No Apple/EV
          # certs exist yet, and Tauri treats an *empty* cert env var as "set"
          # (Rust `env::var` returns `Ok("")`), then fails on `security import` of an
          # empty certificate. Omitting the vars entirely makes macOS and Windows ship
          # unsigned (ad-hoc). When real certs arrive, re-add `WINDOWS_CERTIFICATE`
          # (+ `_PASSWORD`) and the `APPLE_*` group here — see docs/distribution.md.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tauri crate root (owns tauri.conf.json). Matches `pnpm tauri`'s cd.
          projectPath: apps/desktop
          # One draft release per tag; tauri-action reuses it across matrix legs so
          # all three OS bundles land in the same release.
          tagName: ${{ github.ref_name }}
          releaseName: "shalgalt-omr ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # macos-latest is arm64; build for the explicit aarch64 target. Other OSes
          # pass an empty string ⇒ native host target.
          args: ${{ matrix.platform.tauri_target_arg }}

      # --- Attach the standalone server binary -----------------------------------
      # tauri-action created/updated the draft release; gh attaches the server binary
      # to the same tag. `gh release upload --clobber` is idempotent across re-runs.
      - name: Locate and upload server binary (unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release artifacts land under target/<triple>/release when --target is used,
          # else target/release. Resolve defensively.
          BIN="$(find target -type f -name '${{ matrix.platform.server_bin }}' -path '*release*' | head -n 1)"
          if [ -z "$BIN" ]; then
            echo "::error::server binary '${{ matrix.platform.server_bin }}' not found under target/"
            exit 1
          fi
          cp "$BIN" "${{ matrix.platform.server_asset }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.platform.server_asset }}" --clobber

      - name: Locate and upload server binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bin = Get-ChildItem -Path target -Recurse -Filter '${{ matrix.platform.server_bin }}' |
            Where-Object { $_.FullName -match 'release' } | Select-Object -First 1
          if ($null -eq $bin) {
            Write-Error "server binary '${{ matrix.platform.server_bin }}' not found under target/"
            exit 1
          }
          Copy-Item $bin.FullName -Destination "${{ matrix.platform.server_asset }}" -Force
          gh release upload "${{ github.ref_name }}" "${{ matrix.platform.server_asset }}" --clobber

  # --- Updater manifest publish -------------------------------------------------
  # tauri-action signs each bundle and emits a per-bundle `<bundle>.sig`. The updater
  # consumes a single latest.json hosted at the configured endpoint
  # (https://filename24.github.io/shalgalt-omr/latest.json) on the gh-pages branch root.
  #
  # The draft release's assets carry the .sig files and download URLs. We build
  # latest.json from the gh CLI's view of the release, then publish to gh-pages.
  #
  # NOTE: the draft release is human-published later. The endpoint will only serve a
  # working manifest once the assets are public, which is fine — schools have auto-update
  # OFF by default (master plan §6, Track-UI preference key shalgalt-omr.auto-update).
  publish-updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip a leading `v` for the updater `version` field (semver, no prefix).
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Map a release asset filename to its detached signature, fetched from the
          # release. Tauri names sigs "<bundle>.sig".
          fetch_sig() {
            local asset="$1"
            gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets[] | select(.name == \"${asset}.sig\") | .name" > /tmp/has_sig || true
            if [ -s /tmp/has_sig ]; then
              gh release download "$TAG" --repo "$REPO" --pattern "${asset}.sig" --dir /tmp --clobber
              cat "/tmp/${asset}.sig"
            fi
          }

          # Find the primary updater artifact per platform among the release assets.
          # Linux uses AppImage, macOS uses the .app.tar.gz, Windows uses the NSIS
          # setup .exe — these are the targets tauri-plugin-updater knows how to apply.
          asset_for() {
            local pattern="$1"
            gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets[] | select(.name | test(\"${pattern}\")) | .name" | head -n 1
          }

          LINUX_ASSET="$(asset_for '\\.AppImage$' || true)"
          MAC_ASSET="$(asset_for '\\.app\\.tar\\.gz$' || true)"
          WIN_ASSET="$(asset_for '-setup\\.exe$' || true)"

          # Build the platforms map, including only platforms that actually produced a
          # signed updater artifact. The updater keys are {os}-{arch}.
          PLATFORMS="{}"
          add_platform() {
            local key="$1" asset="$2"
            [ -z "$asset" ] && return 0
            local sig
            sig="$(fetch_sig "$asset")"
            [ -z "$sig" ] && { echo "::warning::no .sig for $asset; skipping $key"; return 0; }
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg k "$key" --arg url "${BASE}/${asset}" --arg sig "$sig" \
              '. + {($k): {signature: $sig, url: $url}}')"
          }

          add_platform "linux-x86_64" "$LINUX_ASSET"
          add_platform "darwin-aarch64" "$MAC_ASSET"
          add_platform "windows-x86_64" "$WIN_ASSET"

          mkdir -p dist-manifest
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the GitHub release for changelog." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > dist-manifest/latest.json

          echo "Generated latest.json:"
          cat dist-manifest/latest.json

      # Publish latest.json to the gh-pages branch root so the configured updater
      # endpoint (https://filename24.github.io/shalgalt-omr/latest.json) resolves.
      # keep_files preserves any other gh-pages content (e.g. user manual, API docs).
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist-manifest
          keep_files: true
          commit_message: "chore(release): publish updater manifest for ${{ github.ref_name }}"
