[package]
name = "shalgalt-core"
description = "Pure-Rust core: domain models, grading engine, xlsx export, axum router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "shalgalt_core"
path = "src/lib.rs"

[dependencies]
# Domain serialization (Rule 3) — every model derives Serialize/Deserialize.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error envelope shared across the workspace.
thiserror = "2"
anyhow = "1"

# axum router for the background HTTP server (Rule 4). The actual `tokio::spawn` /
# graceful-shutdown harness lives in `apps/desktop` so the router can stay
# Tauri-agnostic and be reused by `apps/server` (P5-05).
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# xlsx result export (P5-01). The writer is pure — it produces an in-memory
# buffer — and all human-language text (sheet names, headers, status words) is
# injected by the host via `export::ReportLabels`, so this crate stays
# English-only while the workbook ships Mongolian headers.
rust_xlsxwriter = "0.95"

# TypeScript binding generation (P2-04). Domain types derive `TS` and emit
# `.ts` interfaces into `src/lib/types/generated/` whenever `cargo test -p
# shalgalt-core` runs (frontend `pnpm generate-types` wraps that). Required at
# build time because the derive expands to runtime code.
ts-rs = "10"
