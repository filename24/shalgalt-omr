# Shalgalt Omr Workflow Add Or Evolve Pdf Feature

## Action

Follow the add-or-evolve-pdf-feature workflow:
1. Update or create files in crates/shalgalt-pdf/src/ (e.g., new modules, layout, style, shapes)
2. Add or update font assets in crates/shalgalt-pdf/assets/fonts/
3. Update or create tests in crates/shalgalt-pdf/tests/ (including golden tests and smoke tests)
4. Update or create related domain files in crates/shalgalt-core/src/domain/
5. Update Cargo.lock and relevant Cargo.toml files
6. Update generated TypeScript types in src/lib/types/generated/
7. Optionally, add documentation in docs/adr/

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: crates/shalgalt-pdf/src/*.rs, crates/shalgalt-pdf/assets/fonts/*, crates/shalgalt-pdf/tests/*.rs

