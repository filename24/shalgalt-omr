# Shalgalt Omr Workflow Add Database Table Or Schema Change

## Action

Follow the add-database-table-or-schema-change workflow:
1. Create or modify a migration file in src-tauri/migrations/*.sql
2. Update Rust domain model in src-tauri/src/domain/*.rs
3. Update or create TypeScript DB accessors in src/lib/db/*.ts
4. Update TypeScript types in src/lib/types/*.ts
5. Update or add fixtures/tests in src-tauri/tests/*

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: src-tauri/migrations/*.sql, src-tauri/src/domain/*.rs, src/lib/db/*.ts

