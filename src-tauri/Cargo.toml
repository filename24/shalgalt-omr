[package]
name = "shalgalt-omr"
version = "0.1.0"
description = "Local-First OMR Grading IDE"
authors = ["filename24"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shalgalt_omr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"

# Desktop-only quality-of-life plugins (guarded by cfg(desktop) at the call site)
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# --- Database (Blueprint §4) ---
# Tauri SQL plugin: defines migrations on the Rust side and is consumed from the frontend
# via `@tauri-apps/plugin-sql` using `Database.load("sqlite:shalgalt-omr.sqlite")`.
# We deliberately do NOT keep a separate sqlx pool here — DB CRUD is unified through the
# frontend.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# --- Computer Vision (Blueprint §2 — opencv-rust) ---
# NOTE: Requires system-installed OpenCV (libopencv-dev on Debian/Ubuntu, brew opencv on macOS,
# or vcpkg on Windows). See README for setup.
opencv = { version = "0.94", default-features = false, features = [
    "clang-runtime",
    "imgcodecs",
    "imgproc",
] }

# --- PDF rasterization (Blueprint §2 — pdfium-render) ---
# NOTE: Requires the pdfium dynamic library at runtime. We use `bblanchon/pdfium-binaries`
# downloaded at build/install time. See README.
pdfium-render = { version = "0.8", features = ["thread_safe", "image", "sync"] }
image = "0.25"

# --- Excel export (Blueprint §2 — rust_xlsxwriter) ---
rust_xlsxwriter = { version = "0.83", features = ["chrono"] }

# --- Background HTTP server (Blueprint §2 — axum) ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# --- Misc ---
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
sha2 = "0.10"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
